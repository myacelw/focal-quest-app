<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让内容延伸到刘海/Home 指示条区域，配合 env(safe-area-inset-*) 自己留白。
         maximum-scale / user-scalable=no 刻意保留：双指缩放会整体放大"银行卡对齐"，直接毁掉物理标定。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>变焦大冒险 · FocalQuest</title>
    <!-- iOS「添加到主屏幕」：图标 + 全屏 standalone -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="变焦大冒险" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
