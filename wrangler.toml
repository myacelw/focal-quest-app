# Cloudflare Pages 项目声明。3b 会在此文件追加 D1 binding。
#
# 项目名是 focal-quest-app 而非 focal-quest：新版 Cloudflare 里 Workers 与 Pages 共用
# 命名空间，账号里已有一个同名 Worker（误建，见 docs/部署到-Cloudflare-Pages.md），
# 再建同名 Pages 项目会被 API 拒绝（错误码 8000000，报文并不会说明是重名）。
name = "focal-quest-app"
compatibility_date = "2026-07-25"
pages_build_output_dir = "dist"

[[d1_databases]]
# binding 名是我们自己定的，不要照抄 `wrangler d1 create` 输出里建议的 focal_quest_db——
# functions/ 下全部代码按 env.DB 取库（见 functions/lib/db.ts 的 Env 接口），改名会让所有
# 接口拿到 undefined 而在运行时崩，且本地 --local 未必暴露。
binding = "DB"
database_name = "focal-quest-db"
database_id = "3b0cc46c-4b11-4f87-ba62-1bcccde659b7"
migrations_dir = "migrations"
